<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- funcion de declarativa -->
    <script>
        function saludar(nombre){
            return `Hola, ${nombre}!`;
        }
        console.log(saludar("Ana"));
    </script>

    
    <!-- Propiedades-->
    <script>
        let persona = {
            nombre: "Carlos",
            edad: 30,
            saludar: function(){
                console.log(`Hola, soy ${this.nombre}`);
            }
        };
        console.log(persona.nombre);
        persona.saludar();
    </script>

    <!-- Agregar, modificar y eliminar propiedades -->
    <script>
        let person = {
            nombre: "Juan",
            edad: 30,
            profesion: "Developer"
        };
        console.log(person.nombre);
        console.log(person["edad"]);

        person.edad = 31;
        console.log(person.edad);

        delete person.profesion;
        console.log(person.profesion);
    </script>
</body>
</html>
