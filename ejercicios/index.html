<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        
        <!-- Imprimir por pantalla ( console.log() )-->
        <script>
            let name = "Juan"
            const age = 25;
            console.log(`Hola, mi nombre es ${name} y tengo ${age} años.`);
        </script>

        <script>
            var variableGlobal = "Soy accesible en todo el archivo";
            let variableLocal = "Puedo cambiar";
            variableLocal = "Cambio permitido";
        </script>

        <!-- if -->
        <script>
            let edad = 18;
            if(edad >= 18){
                console.log("Eres mayor de edad.")
            }
            else{
                confirm.log("Eres menor de edad.");
            }
            let mensaje = (edad >= 18) ? "Mayor de edad" : "Menor de edad";
            console.log(mensaje);
        </script>

        <!-- for -->
        <script>
            for(let i = 0; i < 5; i++){
                console.log(`Iteración: ${i}`);
            }
        </script>

        <!-- while -->
        <script>
            let contador = 0;
            while(contador < 3){
                console.log(`Contador: ${contador}`);
                contador++;
            }
        </script>

        <!-- foreach -->
        <script>
            let frutas = ["Manzana", "Pera", "Sandia", "Melon"]
            frutas.forEach((fruta, indice) => {console.log(`Fruta ${indice + 1}: ${fruta}`);})
        </script>

        <!-- funcion de declarativa -->
        <script>
            function saludar(nombre){
                return `Hola, ${nombre}!`;
            }
            console.log(saludar("Ana"));
        </script>

        <!-- Funcion flecha (Hacer una suma) -->
        <script>
            const sumar = (a, b) =>  a + b;
            console.log(sumar(5, 3));
        </script>

        <!-- Funcion flecha (Hacer una resta) -->
        <script>
            const restar = (a, b) =>  a - b;
            console.log(restar(5, 3));
        </script>

        <!-- Funcion flecha (Hacer una multiplicacion) -->
        <script>
            const multiplicar = (a, b) =>  a * b;
            console.log(multiplicar(5, 3));
        </script>

        <!-- Funcion flecha (Hacer una division) -->
        <script>
            const dividir = (a, b) =>  a / b;
            console.log(dividir(5, 3));
        </script>

        <!-- Propiedades-->
        <script>
            let persona = {
                nombre: "Carlos",
                edad: 30,
                saludar: function(){
                    console.log(`Hola, soy ${this.nombre}`);
                }
            };
            console.log(persona.nombre);
            persona.saludar();
        </script>

        <!-- Agregar, modificar y eliminar propiedades -->
        <script>
            let person = {
                nombre: "Juan",
                edad: 30,
                profesion: "Developer"
            };
            console.log(person.nombre);
            console.log(person["edad"]);

            person.edad = 31;
            console.log(person.edad);

            delete person.profesion;
            console.log(person.profesion);
        </script>

    </body>
